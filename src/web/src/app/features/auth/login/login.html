<div class="min-h-screen bg-background flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white/70 dark:bg-slate-900/70 backdrop-blur-md rounded-2xl shadow-xl p-8 border border-border">
    <h1 class="font-lexend text-2xl font-semibold text-foreground mb-6 text-center">Welcome Back</h1>
    
    @if (authStore.error()) {
      <div class="mb-4 p-3 bg-red-100/50 border border-red-200 text-red-700 rounded-xl text-sm text-center">
        {{ authStore.error() }}
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-muted mb-1" i18n>Email</label>
        <input data-testid="email-input" type="email" formControlName="email" class="w-full px-4 py-2 rounded-xl border border-border focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all" />
      </div>
      <div>
        <label class="block text-sm font-medium text-muted mb-1" i18n>Password</label>
        <input data-testid="password-input" type="password" formControlName="password" class="w-full px-4 py-2 rounded-xl border border-border focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all" />
      </div>
      <button data-testid="login-submit-btn" type="submit" [disabled]="loginForm.invalid || authStore.loading()" class="w-full bg-primary hover:bg-secondary text-white font-medium py-2.5 rounded-xl transition-all scale-100 hover:scale-[1.02] cursor-pointer disabled:opacity-50 flex items-center justify-center gap-2">
        @if (authStore.loading()) {
          <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        }
        <span i18n>Sign In</span>
      </button>
    </form>
    <p class="mt-4 text-center text-sm text-muted">
      <span i18n>Don't have an account?</span> 
      <a routerLink="/register" class="text-primary hover:underline" i18n>Register here</a>
    </p>
  </div>
</div>
