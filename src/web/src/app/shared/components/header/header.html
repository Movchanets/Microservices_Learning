<header class="sticky top-0 z-50 w-full border-b border-border bg-background/80 backdrop-blur-xl transition-all duration-300">
  <div class="container mx-auto flex h-20 items-center justify-between px-6">
    <a routerLink="/" class="flex items-center gap-3 group" aria-label="Go to homepage" data-testid="header-logo">
      <div class="w-10 h-10 rounded-xl bg-primary flex items-center justify-center shadow-lg shadow-primary/20 group-hover:scale-110 transition-transform">
        <span class="text-white font-bold text-2xl">M</span>
      </div>
      <span class="text-2xl font-bold tracking-tight text-foreground font-lexend">Marketplace</span>
    </a>
    
    <nav class="hidden md:flex gap-8">
      <a routerLink="/catalog" class="text-sm font-medium text-muted hover:text-primary transition-colors relative group" data-testid="nav-catalog">
        Catalog
        <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-primary transition-all group-hover:w-full"></span>
      </a>
      <a routerLink="/seller-dashboard" class="text-sm font-medium text-muted hover:text-primary transition-colors relative group" data-testid="nav-sell">
        Sell
        <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-primary transition-all group-hover:w-full"></span>
      </a>
    </nav>
    
    <div class="flex items-center gap-4">
      @if (!user()) {
        <a routerLink="/auth/login" class="text-sm font-medium text-muted hover:text-foreground transition-colors" data-testid="nav-login">Sign in</a>
        <a routerLink="/auth/register" class="inline-flex h-10 items-center justify-center rounded-xl bg-primary px-6 py-2 text-sm font-medium text-white shadow-xl shadow-primary/20 transition-all hover:scale-[1.05] hover:shadow-primary/40 active:scale-95 focus-visible:ring-2 focus-visible:ring-primary focus-visible:outline-none" data-testid="nav-register">
          Get Started
        </a>
      } @else {
        <div class="relative">
          <button 
            (click)="toggleMenu()"
            class="flex items-center gap-2 p-1.5 rounded-xl border border-border bg-card/50 hover:bg-card transition-all focus:ring-2 focus:ring-primary/20 outline-none group"
            data-testid="user-menu-trigger"
          >
            <div class="w-8 h-8 rounded-lg bg-primary/10 flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-white transition-all">
              <lucide-icon [name]="UserIcon" class="w-4 h-4"></lucide-icon>
            </div>
            <span class="text-sm font-semibold text-foreground px-1 hidden sm:block">{{ user()?.firstName }}</span>
            <lucide-icon [name]="ChevronIcon" class="w-4 h-4 text-muted transition-transform" [class.rotate-180]="isMenuOpen()"></lucide-icon>
          </button>

          <!-- Dropdown Menu -->
          <div 
            *ngIf="isMenuOpen()"
            (click)="isMenuOpen.set(false)"
            class="absolute right-0 mt-2 w-56 bg-card/90 backdrop-blur-xl border border-border rounded-2xl shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-200 z-[100]"
            data-testid="user-dropdown"
          >
            <div class="p-4 border-b border-border/50">
              <p class="text-xs font-semibold text-muted-foreground uppercase tracking-wider mb-1">Signed in as</p>
              <p class="text-sm font-bold text-foreground truncate">{{ user()?.email }}</p>
            </div>
            
            <div class="p-2">
              <a 
                routerLink="/profile"
                class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-muted-foreground hover:text-foreground hover:bg-primary/10 transition-all"
                data-testid="nav-profile"
              >
                <lucide-icon [name]="UserIcon" class="w-4 h-4"></lucide-icon>
                My Profile
              </a>
              <a 
                routerLink="/seller-dashboard"
                class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-muted-foreground hover:text-foreground hover:bg-primary/10 transition-all"
              >
                <lucide-icon [name]="SettingsIcon" class="w-4 h-4"></lucide-icon>
                Dashboard
              </a>
            </div>

            <div class="p-2 border-t border-border/50">
              <button 
                (click)="logout()"
                class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-red-500 hover:bg-red-500/10 transition-all text-left"
                data-testid="nav-logout"
              >
                <lucide-icon [name]="LogOutIcon" class="w-4 h-4"></lucide-icon>
                Sign Out
              </button>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</header>
