<header
  class="sticky top-0 z-50 w-full border-b border-border bg-background/80 backdrop-blur-xl transition-all duration-300 relative"
>
  <div class="container mx-auto flex h-20 items-center justify-between gap-6 px-6">
    <!-- Left: Logo & Catalog Button -->
    <div class="flex items-center gap-6">
      <a
        routerLink="/"
        class="flex items-center gap-3 group"
        aria-label="Go to homepage"
        data-testid="header-logo"
      >
        <div
          class="w-10 h-10 rounded-xl bg-primary flex items-center justify-center shadow-lg shadow-primary/20 group-hover:scale-110 transition-transform"
        >
          <span class="text-white font-bold text-2xl">M</span>
        </div>
        <span class="text-2xl font-bold tracking-tight text-foreground font-lexend hidden lg:block">Marketplace</span>
      </a>

      <button 
        (click)="toggleMegaMenu()"
        class="flex items-center gap-2 h-11 px-5 rounded-xl bg-primary hover:bg-primary/90 text-white font-medium shadow-lg shadow-primary/20 transition-all active:scale-95"
      >
        <lucide-icon [name]="MenuIcon" class="w-5 h-5"></lucide-icon>
        <span class="hidden sm:inline">Catalog</span>
      </button>
    </div>

    <!-- Center: Search Bar -->
    <div class="flex-1 max-w-3xl hidden md:block">
      <form (submit)="search(searchInput.value); $event.preventDefault()" class="relative flex items-center w-full">
        <lucide-icon [name]="SearchIcon" class="absolute left-4 w-5 h-5 text-muted-foreground"></lucide-icon>
        <input 
          #searchInput
          type="text" 
          name="q"
          placeholder="I am looking for..."
          class="w-full h-11 pl-12 pr-4 bg-muted/50 border border-transparent hover:border-border focus:border-primary focus:bg-background rounded-xl outline-none transition-all"
        />
        <button type="submit" class="absolute right-2 h-7 px-4 rounded-lg bg-primary/10 text-primary font-medium text-sm hover:bg-primary hover:text-white transition-colors">
          Search
        </button>
      </form>
    </div>

    <!-- Right: Utility Icons -->
    <div class="flex items-center gap-3 sm:gap-5">
      <button class="flex flex-col items-center justify-center gap-1 text-muted-foreground hover:text-primary transition-colors h-11 w-11 rounded-xl hover:bg-primary/5 hidden sm:flex">
        <lucide-icon [name]="GlobeIcon" class="w-5 h-5"></lucide-icon>
        <span class="text-[10px] font-medium uppercase">EN</span>
      </button>
      
      <button class="flex flex-col items-center justify-center gap-1 text-muted-foreground hover:text-primary transition-colors h-11 w-11 rounded-xl hover:bg-primary/5 hidden lg:flex">
        <lucide-icon [name]="HeartIcon" class="w-5 h-5"></lucide-icon>
      </button>

      <!-- Cart Icon -->
      <a routerLink="/cart" class="relative flex flex-col items-center justify-center gap-1 text-muted-foreground hover:text-primary transition-colors h-11 w-11 rounded-xl hover:bg-primary/5">
        <lucide-icon [name]="CartIcon" class="w-5 h-5"></lucide-icon>
        <!-- Badge could go here -->
      </a>

      <!-- Profile Section -->
      @if (!user()) {
        <a
          routerLink="/auth/login"
          class="text-sm font-medium text-muted hover:text-foreground transition-colors hidden sm:block"
          data-testid="nav-login"
          >Sign in</a
        >
      } @else {
        <div class="relative">
          <button
            (click)="toggleMenu()"
            class="flex items-center gap-2 p-1.5 rounded-xl border border-border bg-card/50 hover:bg-card transition-all focus:ring-2 focus:ring-primary/20 outline-none group"
            data-testid="user-menu-trigger"
          >
            <div
              class="w-8 h-8 rounded-lg bg-primary/10 flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-white transition-all"
            >
              <lucide-icon [name]="UserIcon" class="w-4 h-4"></lucide-icon>
            </div>
            <lucide-icon
              [name]="ChevronIcon"
              class="w-4 h-4 text-muted transition-transform"
              [class.rotate-180]="isMenuOpen()"
            ></lucide-icon>
          </button>

          <!-- Dropdown Menu -->
          <div
            *ngIf="isMenuOpen()"
            (click)="isMenuOpen.set(false)"
            class="absolute right-0 mt-2 w-56 bg-card/90 backdrop-blur-xl border border-border rounded-2xl shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-200 z-[100]"
            data-testid="user-dropdown"
          >
            <div class="p-4 border-b border-border/50">
              <p class="text-xs font-semibold text-muted-foreground uppercase tracking-wider mb-1">
                Signed in as
              </p>
              <p class="text-sm font-bold text-foreground truncate">{{ user()?.email }}</p>
            </div>

            <div class="p-2">
              <a
                routerLink="/profile"
                class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-muted-foreground hover:text-foreground hover:bg-primary/10 transition-all"
                data-testid="nav-profile"
              >
                <lucide-icon [name]="UserIcon" class="w-4 h-4"></lucide-icon>
                My Profile
              </a>
              <a
                routerLink="/seller-dashboard"
                class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-muted-foreground hover:text-foreground hover:bg-primary/10 transition-all"
              >
                <lucide-icon [name]="SettingsIcon" class="w-4 h-4"></lucide-icon>
                Dashboard
              </a>
              @if (user()?.role === 'Admin') {
                <a
                  routerLink="/admin"
                  class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-muted-foreground hover:text-foreground hover:bg-primary/10 transition-all"
                  data-testid="nav-admin"
                >
                  <lucide-icon name="Shield" class="w-4 h-4"></lucide-icon>
                  Admin Panel
                </a>
              }
            </div>

            <div class="p-2 border-t border-border/50">
              <button
                (click)="logout()"
                class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-red-500 hover:bg-red-500/10 transition-all text-left"
                data-testid="nav-logout"
              >
                <lucide-icon [name]="LogOutIcon" class="w-4 h-4"></lucide-icon>
                Sign Out
              </button>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</header>

@if (isMegaMenuOpen()) {
  <app-mega-menu (closeMenu)="closeMegaMenu()"></app-mega-menu>
}
