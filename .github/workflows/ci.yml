name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"

      - id: install
        run: pnpm install --frozen-lockfile

      # 1. Отримуємо поточну версію Playwright для ключа кешу
      - name: Get Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(pnpm --filter e2e-tests exec playwright --version | awk '{print $2}')" >> $GITHUB_ENV

      # 2. Налаштовуємо кеш GitHub Actions для папки з браузерами
      - name: Cache Playwright Browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      # 3. Якщо кешу немає — качаємо Chromium та встановлюємо системні залежності
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter e2e-tests exec playwright install chromium --with-deps

      # 4. Якщо кеш є — системні залежності все одно треба встановити
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter e2e-tests exec playwright install-deps chromium

      - name: Restore .NET dependencies
        run: dotnet restore src/Aspire/Marketplace.AppHost/Marketplace.AppHost.csproj

      - name: Build .NET solution
        run: dotnet build src/Aspire/Marketplace.AppHost/Marketplace.AppHost.csproj -c Debug --no-restore

      - uses: nrwl/nx-set-shas@v5

      # Cache Nx local cache
      - name: Cache Nx local cache
        uses: actions/cache@v5
        with:
          path: .nx/cache
          key: nx-cache-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-cache-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
            nx-cache-${{ runner.os }}-

      # Pre-pull Docker images that integration and E2E tests need.
      # Without this, cold CI runs spend 5+ min pulling postgres, redis,
      # rabbitmq, elasticsearch, and azurite — exceeding health-check timeouts.
      - name: Pre-pull Docker images
        run: |
          docker pull postgres:latest &
          docker pull redis:latest &
          docker pull rabbitmq:4-management &
          docker pull docker.elastic.co/elasticsearch/elasticsearch:9.0.0 &
          docker pull mcr.microsoft.com/azure-storage/azurite:latest &
          wait
          echo "All images pulled."

      # Run unit + integration tests first (excludes E2E to avoid Docker port conflicts
      # with Testcontainers — the E2E globalSetup starts the AppHost which also spawns
      # Elasticsearch, Postgres, Redis, etc.)
      - name: Run unit & integration tests
        env:
          NX_NO_CLOUD: true
          NX_DAEMON: false
          TESTCONTAINERS_RYUK_DISABLED: true
        run: pnpm exec nx affected -t test build --exclude=e2e-tests

      # E2E tests run last — they start the full AppHost and must not conflict
      # with Testcontainers used by integration tests above.
      - name: Run E2E tests
        env:
          NX_NO_CLOUD: true
          NX_DAEMON: false
        run: pnpm exec nx run e2e-tests:test
