name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Connect your workspace by running "nx connect" and uncomment this line to enable task distribution
      # - run: pnpm dlx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      # Cache node_modules
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"

      - id: install
        run: pnpm install --frozen-lockfile

      # 1. Отримуємо поточну версію Playwright для ключа кешу
      - name: Get Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(pnpm --filter e2e-tests exec playwright --version | awk '{print $2}')" >> $GITHUB_ENV

      # 2. Налаштовуємо кеш GitHub Actions для папки з браузерами
      - name: Cache Playwright Browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      # 3. Якщо кешу немає — качаємо Chromium та встановлюємо системні залежності
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter e2e-tests exec playwright install chromium --with-deps

      # 4. Якщо кеш є — системні залежності (Linux пакети) все одно треба встановити,
      # бо вони не зберігаються в ~/.cache, але це займає буквально пару секунд.
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter e2e-tests exec playwright install-deps chromium

      - uses: nrwl/nx-set-shas@v5

      # Prepend any command with "nx record --" to record its logs to Nx Cloud
      # - run: pnpm exec nx record -- echo Hello World
      - run: pnpm exec nx affected -t lint test build
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: pnpm exec nx fix-ci
        if: always() && steps.install.outcome == 'success'
