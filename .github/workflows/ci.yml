name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"

      - id: install
        run: pnpm install --frozen-lockfile

      # 1. Отримуємо поточну версію Playwright для ключа кешу
      - name: Get Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(pnpm --filter e2e-tests exec playwright --version | awk '{print $2}')" >> $GITHUB_ENV

      # 2. Налаштовуємо кеш GitHub Actions для папки з браузерами
      - name: Cache Playwright Browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      # 3. Якщо кешу немає — качаємо Chromium та встановлюємо системні залежності
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter e2e-tests exec playwright install chromium --with-deps

      # 4. Якщо кеш є — системні залежності все одно треба встановити
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter e2e-tests exec playwright install-deps chromium

      - name: Restore .NET dependencies
        run: dotnet restore src/Aspire/Marketplace.AppHost/Marketplace.AppHost.csproj

      - name: Build .NET solution
        run: dotnet build src/Aspire/Marketplace.AppHost/Marketplace.AppHost.csproj -c Debug --no-restore

      - uses: nrwl/nx-set-shas@v5

      # Cache Nx local cache
      - name: Cache Nx local cache
        uses: actions/cache@v5
        with:
          path: .nx/cache
          key: nx-cache-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-cache-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
            nx-cache-${{ runner.os }}-

      # Run affected targets with local cache only and without daemon
      - name: Run affected targets
        env:
          NX_NO_CLOUD: true
          NX_DAEMON: false # Вимикає фоновий процес Nx, який викликає зависання
        run: pnpm exec nx affected -t test build
