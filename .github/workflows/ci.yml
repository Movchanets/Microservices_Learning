name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Marketplace.slnx

      - name: Build
        run: dotnet build Marketplace.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Marketplace.slnx --no-build -c Release
